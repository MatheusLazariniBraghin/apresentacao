<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apresentação Interativa – Logística de Concreteiras SABESP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--navy:#17365D;--blue:#1F4E78;--border:#D0D7DE;--bg:#f8fafc}
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1f2937}
#app{height:100%;display:grid;grid-template-columns:455px 1fr}
#panel{background:#fff;border-right:1px solid var(--border);padding:16px;overflow:auto}
#map{height:100%;width:100%}
h1{font-size:20px;margin:0 0 6px;color:var(--navy)}
h2{font-size:16px;margin:14px 0 8px;color:var(--blue)}
h3{font-size:13px;margin:12px 0 6px;color:#334155}
.note{background:#EFF6FF;border-radius:10px;padding:11px;font-size:12px;line-height:1.45}
.small{font-size:11px;line-height:1.35;color:#64748b}
.btn{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:8px 10px;margin:4px 3px 0 0;cursor:pointer;font-size:12px}
.btn.alt{background:#64748b} .btn.warn{background:#B45309}
.navrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.stepbar{font-size:11px;color:#64748b;margin:4px 0 9px}
.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:7px 0 13px}
.progress span{display:block;height:100%;background:var(--blue);width:0%}
.chk{display:block;margin:4px 0;font-size:12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.res{width:19px;height:19px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.reslabel{background:rgba(255,255,255,.97);border:1px solid #9ca3af;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:bold;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.truck{width:34px;height:42px;position:relative;display:flex;align-items:flex-start;justify-content:center}
.truck .head{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:16px}
.truck:after{content:'';position:absolute;top:27px;border:8px solid transparent;border-top-color:var(--c)}
.trucklabel{background:rgba(255,255,255,.96);border:1px solid #9ca3af;border-radius:6px;padding:2px 5px;font-size:9px;font-weight:bold;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.timelabel{background:#fff;border:1px solid #9ca3af;border-radius:12px;padding:2px 6px;font-size:10px;font-weight:bold;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card{border:1px solid #e5e7eb;border-radius:9px;padding:8px;margin-top:7px;background:#fff;cursor:pointer}
.card.rank1{background:#DCFCE7} .card.rank2{background:#FEF3C7} .card.rank3{background:#E0F2FE}
.ranktitle{font-weight:bold;color:var(--navy)}
.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:6px}
.metric div{font-size:11px;background:#f8fafc;border-radius:6px;padding:5px}
.badge{display:inline-block;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:bold}
.green{background:#DCFCE7;color:#166534} .yellow{background:#FEF3C7;color:#92400e} .orange{background:#FFEDD5;color:#9A3412} .red{background:#FEE2E2;color:#991B1B}
.status{font-size:12px;background:#f8fafc;border:1px solid #e5e7eb;padding:8px;border-radius:7px;margin-top:8px}
select{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0}
.kpi div{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:8px}
.kpi b{font-size:17px;color:var(--navy)}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:54% 46%}#panel{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div id="app">
<div id="panel">
  <h1>Apresentação Interativa – Logística SABESP</h1>
  <div class="stepbar" id="stepInfo"></div>
  <div class="progress"><span id="progressFill"></span></div>
  <h2 id="stepTitle"></h2>
  <div id="stepText" class="note"></div>

  <div class="navrow">
    <button class="btn alt" id="prev">◀ Anterior</button>
    <button class="btn" id="next">Próximo ▶</button>
    <button class="btn warn" id="present">Modo apresentação</button>
  </div>

  <div class="kpi">
    <div><span class="small">Reservatórios</span><br><b>24</b></div>
    <div><span class="small">Alternativas</span><br><b>120</b></div>
  </div>

  <h3>Controles rápidos</h3>
  <label class="chk"><input id="showBases" type="checkbox" checked> Mostrar concreteiras selecionadas</label>
  <label class="chk"><input id="showLabels" type="checkbox" checked> Mostrar Lote + Local</label>
  <label class="chk"><input id="showBaseLabels" type="checkbox" checked> Mostrar nome das usinas</label>

  <h3>Cenário de tempo</h3>
  <label class="chk"><input type="radio" name="scenario" value="normal"> Normal</label>
  <label class="chk"><input type="radio" name="scenario" value="morning"> Pico manhã – 07h</label>
  <label class="chk"><input type="radio" name="scenario" value="afternoon" checked> Pico tarde – 17h30</label>

  <h3>Reservatório para demonstração</h3>
  <select id="reservoirSelect"></select>
  <div class="navrow">
    <button class="btn" id="calculate">Calcular 5 rotas</button>
    <button class="btn" id="drawBest">Melhor rota</button>
    <button class="btn" id="drawTop3">Comparar Top 3</button>
    <button class="btn alt" id="clearRoutes">Limpar</button>
  </div>
  <div id="status" class="status">Selecione um reservatório ou siga os passos da apresentação.</div>
  <div id="cards"></div>

  <h3>Legenda das concreteiras</h3>
  <div class="small">
    <span class="dot" style="background:#0057B8"></span><b>POLIMIX</b><br>
    <span class="dot" style="background:#C62828"></span><b>REI / REI MIX</b><br>
    <span class="dot" style="background:#E65100"></span><b>CORTESIA</b><br>
    <span class="dot" style="background:#5D4037"></span><b>CONCRELONGO</b><br>
    <span class="dot" style="background:#6A1B9A"></span><b>VOTORANTIM / ENGEMIX</b>
  </div>
</div>
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const map=L.map('map').setView([-23.57,-46.63],10);

const lRes=L.layerGroup().addTo(map),lLabels=L.layerGroup().addTo(map),lBases=L.layerGroup().addTo(map),lBaseLabels=L.layerGroup().addTo(map),lRoutes=L.layerGroup().addTo(map),lEta=L.layerGroup().addTo(map);
let step=0, selected=null, calculated=[];
const routeCache=new Map();

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function scenario(){return document.querySelector('input[name=scenario]:checked').value}
function resIcon(c){return L.divIcon({className:'',html:`<div class="res" style="background:${c}"></div>`,iconSize:[19,19],iconAnchor:[9,9]})}
function labelIcon(r){return L.divIcon({className:'',html:`<span class="reslabel" style="border-color:${LOT[r.lot]}">${r.lot} | ${esc(r.name)}</span>`,iconSize:[205,20],iconAnchor:[-12,10]})}
function truckIcon(c){return L.divIcon({className:'',html:`<div class="truck" style="--c:${c}"><div class="head" style="background:${c}">🚚</div></div>`,iconSize:[34,42],iconAnchor:[17,42]})}
function truckLabelIcon(b){return L.divIcon({className:'',html:`<span class="trucklabel" style="border-color:${b.color}">${esc(b.supplier)} | ${esc(b.base)}</span>`,iconSize:[210,18],iconAnchor:[-12,9]})}
function etaIcon(x){const t=scenarioTime(x);return L.divIcon({className:'',html:`<span class="timelabel">${x.supplier} · ${x.distance.toFixed(1)} km · ${Math.round(t)} min</span>`,iconSize:[205,18],iconAnchor:[-6,9]})}
function level(t){return t<=45?'BAIXO':(t<=75?'MÉDIO':(t<=105?'ALTO':'CRÍTICO'))}
function badge(t){const l=level(t),c=l==='BAIXO'?'green':(l==='MÉDIO'?'yellow':(l==='ALTO'?'orange':'red'));return `<span class="badge ${c}">${l}</span>`}
function scenarioTime(x){const s=scenario();return s==='normal'?x.normal:(s==='morning'?x.morning:x.afternoon)}
function routeKey(x){return `${x.supplier}|${x.base}|${x.reservoir}`}
function score(x){const t=scenarioTime(x);let p=0;if(x.distance>25)p+=20;if(t>120)p+=20;else if(t>=105)p+=10;return Math.max(0,100-x.distance-0.25*t-p)}

function buildSelect(){
  const s=document.getElementById('reservoirSelect');
  s.innerHTML=RES.map(r=>`<option value="${r.lot}|${esc(r.name)}">${r.lot} | ${esc(r.name)} — ${esc(r.municipality)}</option>`).join('');
  s.addEventListener('change',()=>{const [lot,name]=s.value.split('|');const r=RES.find(x=>x.lot===lot&&x.name===name);if(r)selectReservoir(r,true,false);});
}

function activeLot(){
  return steps[step].lot;
}

function drawStatic(){
  lRes.clearLayers();lLabels.clearLayers();lBases.clearLayers();lBaseLabels.clearLayers();
  const lot=activeLot();
  RES.forEach(r=>{
    if(lot&&r.lot!==lot)return;
    const m=L.marker([r.lat,r.lon],{icon:resIcon(LOT[r.lot])}).addTo(lRes);
    m.on('click',()=>selectReservoir(r,true,true));
    if(document.getElementById('showLabels').checked)L.marker([r.lat,r.lon],{icon:labelIcon(r),interactive:false,zIndexOffset:250}).addTo(lLabels);
  });
  if(document.getElementById('showBases').checked){
    BASES.filter(b=>VISIBLE_SUPPLIERS.includes(b.supplier)).forEach(b=>{
      L.marker([b.lat,b.lon],{icon:truckIcon(b.color)}).bindPopup(`<b>${esc(b.supplier)} — ${esc(b.base)}</b><br>${esc(b.address)}`).addTo(lBases);
      if(document.getElementById('showBaseLabels').checked)L.marker([b.lat,b.lon],{icon:truckLabelIcon(b),interactive:false,zIndexOffset:180}).addTo(lBaseLabels);
    });
  }
}

function fitCurrent(){
  const lot=activeLot();
  const pts=[];
  RES.forEach(r=>{if(!lot||r.lot===lot)pts.push([r.lat,r.lon]);});
  BASES.filter(b=>VISIBLE_SUPPLIERS.includes(b.supplier)).forEach(b=>pts.push([b.lat,b.lon]));
  if(pts.length)map.fitBounds(pts,{padding:[28,28]});
}

function selectReservoir(r,zoom,autoCalc){
  selected=r;calculated=[];lRoutes.clearLayers();lEta.clearLayers();
  document.getElementById('reservoirSelect').value=`${r.lot}|${r.name}`;
  document.getElementById('status').innerHTML=`Selecionado: <b>${r.lot} | ${esc(r.name)}</b>`;
  document.getElementById('cards').innerHTML='';
  if(zoom)map.setView([r.lat,r.lon],12);
  if(autoCalc)calculateSelected();
}

async function fetchRoute(x){
  const k=routeKey(x);if(routeCache.has(k))return routeCache.get(k);
  const url=`https://router.project-osrm.org/route/v1/driving/${x.base_lon},${x.base_lat};${x.dest_lon},${x.dest_lat}?overview=full&geometries=geojson`;
  const resp=await fetch(url);if(!resp.ok)throw new Error('HTTP '+resp.status);
  const j=await resp.json();if(!(j.routes&&j.routes[0]))throw new Error('Rota não encontrada');
  const out={distance:j.routes[0].distance/1000,duration:j.routes[0].duration/60,geometry:j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]])};
  routeCache.set(k,out);return out;
}

async function calculateSelected(){
  if(!selected)return;
  calculated=[];lRoutes.clearLayers();lEta.clearLayers();
  const candidates=DATA.filter(x=>x.lot===selected.lot&&x.reservoir===selected.name);
  const st=document.getElementById('status');let ok=0;
  for(let i=0;i<candidates.length;i++){
    const x=candidates[i];st.textContent=`Calculando rota rodoviária ${i+1}/${candidates.length}: ${x.supplier}…`;
    try{
      const route=await fetchRoute(x);
      const normal=route.duration, morning=normal*x.morning_factor, afternoon=normal*x.afternoon_factor;
      calculated.push({...x,distance:route.distance,normal,morning,afternoon,geometry:route.geometry});
      ok++;
    }catch(e){}
    await new Promise(r=>setTimeout(r,420));
  }
  rerank();renderCards();if(calculated[0])drawRoute(calculated[0],true);
  st.innerHTML=`<b>${ok}/${candidates.length} rotas calculadas.</b> Melhor opção atual: <b>${calculated[0]?.supplier||'-'}</b>.`;
}

function rerank(){
  calculated.forEach(x=>x._score=score(x));
  calculated.sort((a,b)=>b._score-a._score||a.distance-b.distance);
  calculated.forEach((x,i)=>x.rank=i+1);
}

function renderCards(){
  document.getElementById('cards').innerHTML=calculated.map(x=>`
    <div class="card ${x.rank===1?'rank1':(x.rank===2?'rank2':(x.rank===3?'rank3':''))}" data-rank="${x.rank}">
      <div class="ranktitle">${x.rank}ª opção · <span style="color:${x.color}">${esc(x.supplier)}</span></div>
      <b>${esc(x.base)}</b>
      <div class="metric">
        <div>Distância real<br><b>${x.distance.toFixed(1)} km</b></div>
        <div>Normal<br><b>${Math.round(x.normal)} min</b></div>
        <div>Pico 07h<br><b>${Math.round(x.morning)} min</b></div>
        <div>Pico 17h30<br><b>${Math.round(x.afternoon)} min</b></div>
      </div>
      ${badge(scenarioTime(x))} · índice <b>${x._score.toFixed(1)}</b> · <a href="${x.gmaps}" target="_blank">Google Maps</a>
    </div>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{const x=calculated.find(r=>r.rank===Number(c.dataset.rank));if(x)drawRoute(x,true);}));
}

function routeStyle(x){return x.rank===1?{color:x.color,weight:5,opacity:.92}:(x.rank===2?{color:x.color,weight:3.8,opacity:.72,dashArray:'10 7'}:{color:x.color,weight:3,opacity:.58,dashArray:'3 8'})}

function drawRoute(x,clearFirst=false){
  if(clearFirst){lRoutes.clearLayers();lEta.clearLayers();}
  L.polyline(x.geometry,routeStyle(x)).bindPopup(`<b>${x.rank}ª opção — ${esc(x.supplier)}</b><br>${esc(x.base)} → ${esc(x.reservoir)}<br>Distância rodoviária: <b>${x.distance.toFixed(1)} km</b><br>Normal: ${Math.round(x.normal)} min<br>07h: ${Math.round(x.morning)} min<br>17h30: ${Math.round(x.afternoon)} min<br>Índice: ${x._score.toFixed(1)}<br><a href="${x.gmaps}" target="_blank">Abrir no Google Maps</a>`).addTo(lRoutes);
  if(selected)L.marker([selected.lat,selected.lon],{icon:etaIcon(x),zIndexOffset:220}).addTo(lEta);
  map.fitBounds(L.latLngBounds(x.geometry),{padding:[35,35]});
}

function applyStep(){
  const s=steps[step];
  document.getElementById('stepInfo').textContent=`Etapa ${step+1} de ${steps.length}`;
  document.getElementById('progressFill').style.width=`${((step+1)/steps.length)*100}%`;
  document.getElementById('stepTitle').textContent=s.title;
  document.getElementById('stepText').innerHTML=s.text;
  drawStatic();
  fitCurrent();
  lRoutes.clearLayers();lEta.clearLayers();calculated=[];document.getElementById('cards').innerHTML='';
  if(s.reservoir){
    const r=RES.find(x=>x.lot===s.lot&&x.name===s.reservoir);
    if(r)selectReservoir(r,false,false);
  }
}

document.getElementById('prev').addEventListener('click',()=>{step=Math.max(0,step-1);applyStep();});
document.getElementById('next').addEventListener('click',()=>{step=Math.min(steps.length-1,step+1);applyStep();});
document.getElementById('present').addEventListener('click',()=>{document.documentElement.requestFullscreen?.();});
document.getElementById('calculate').addEventListener('click',calculateSelected);
document.getElementById('drawBest').addEventListener('click',()=>{if(calculated[0])drawRoute(calculated[0],true);});
document.getElementById('drawTop3').addEventListener('click',()=>{lRoutes.clearLayers();lEta.clearLayers();calculated.slice(0,3).forEach(x=>drawRoute(x,false));});
document.getElementById('clearRoutes').addEventListener('click',()=>{lRoutes.clearLayers();lEta.clearLayers();});
document.getElementById('showBases').addEventListener('change',drawStatic);
document.getElementById('showLabels').addEventListener('change',drawStatic);
document.getElementById('showBaseLabels').addEventListener('change',drawStatic);
document.querySelectorAll('input[name=scenario]').forEach(e=>e.addEventListener('change',()=>{if(calculated.length){rerank();renderCards();drawRoute(calculated[0],true);}}));

buildSelect();
applyStep();
</script>
</body>
</html>
